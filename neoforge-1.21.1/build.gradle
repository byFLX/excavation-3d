plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // Bootstrapped JUnit 5 (ModDevGradle unitTest). Pure geometry tests need no game state,
    // but tests touching ItemStack or registries rely on NeoForge's test bootstrap.
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            gameDirectory = file('run-server')
            programArgument 'nogui'
        }
        // World-level excavation tests (gametest/ExcavationGameTests); exits non-zero on failure.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'excavation3d'
        }
    }

    mods {
        excavation3d {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.excavation3d
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
